services:
  frontend-app:
    build:
      context: .
      dockerfile: ./Dockerfile
    working_dir: /app
    volumes:
      - ../app:/app
    container_name: landing-page-kilocode
    ports:
      - "5173:5173"
    tty: true   # Permite mantener el contenedor en ejecución para depuración y desarrollo interactivo
