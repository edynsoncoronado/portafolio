services:

  odoo:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    container_name: odoo-dev

    volumes:
      # Código fuente Odoo
      - ../odoo:/workspace/odoo

      # Custom addons
      - ../addons-custom:/workspace/addons-custom

      # Configuración
      - ../config:/etc/odoo

      # Persistir datos Odoo
      - odoo-data:/var/lib/odoo

      # # Git
      # - ${HOME}/.gitconfig:/home/vscode/.gitconfig:ro

    # environment:
    #   # PYTHONDONTWRITEBYTECODE: "1"
    #   # PYTHONUNBUFFERED: "1"

    #   ODOO_VERSION: ${ODOO_VERSION:-18.0}

    ports:
      - "8069:8069"

      # Debugger
      - "5678:5678"

    depends_on:
      db:
        condition: service_healthy

    command: sleep infinity

  db:
    image: postgres:17

    container_name: odoo-db

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo

    volumes:
      - postgres-data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U odoo -d postgres"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  odoo-data:
  postgres-data: